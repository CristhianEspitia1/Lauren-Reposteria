<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tarjeta social · Lauren Repostería</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Playfair+Display:ital,wght@0,400;1,400&amp;display=block" rel="stylesheet">
<link href="../css/tokens.css" rel="stylesheet">
<style>
/* Plantilla de scripts/social-images.mjs: 1200 × 630, con los tokens y la portada del manual de marca
   (docs/06-guia-de-estilos.md, «Imagen para compartir»): crema, logo, etiqueta con raya albaricoque, titular
   Playfair con la itálica sobre la franja albaricoque y, a la derecha, la foto en arco con el sello lila. */
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--color-cream); }
body { display: grid; grid-template-columns: 650px 550px; font-family: var(--font-sans); color: var(--color-text); }
.copy { display: flex; flex-direction: column; justify-content: center; padding: 0 32px 0 76px; }
.logo { width: 200px; height: auto; margin-bottom: 44px; }
.eyebrow { display: flex; align-items: center; gap: 18px; font-size: 18px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; }
.eyebrow::before { content: ""; width: 36px; height: 3px; background: var(--color-apricot); flex-shrink: 0; }
h1 { margin-top: 26px; font-family: var(--font-display); font-weight: 400; font-size: 76px; line-height: 1.06; letter-spacing: -.04em; }
h1 em { background: linear-gradient(transparent 68%, color-mix(in srgb, var(--color-apricot) 55%, transparent) 68% 92%, transparent 92%); padding-inline: .06em; }
.foot { margin-top: 30px; font-size: 20px; color: var(--color-text-soft); }
.art { position: relative; }
.photo { position: absolute; inset: 44px 64px 44px 24px; overflow: hidden; border-radius: 240px 240px 5px 5px; background: var(--color-peach); }
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: var(--focus, 50% 50%); display: block; }
.seal { position: absolute; width: 132px; height: 132px; right: 24px; top: 70px; padding: 17px; background: var(--color-lilac); border: 7px solid var(--color-cream); border-radius: 50%; }
.seal img { width: 100%; height: 100%; object-fit: contain; display: block; }
</style>
</head>
<body>
<script>
// Parámetros: ?eyebrow=&title=&em=&photo=&focus=, ?icon=SIZE&pad=0.12&bg=%23d0b4d7 o ?logo=1
const q = new URLSearchParams(location.search);
if (q.has('logo')) {
    document.body.style.cssText = 'display:grid;place-items:center;width:600px;height:360px;background:#fff';
    document.documentElement.style.cssText = 'width:600px;height:360px';
    document.body.innerHTML = '<img src="../assets/brand/lauren-logo.svg" alt="" style="width:460px;height:auto">';
} else if (q.has('icon')) {
    const size = Number(q.get('icon'));
    document.documentElement.style.cssText = document.body.style.cssText = `width:${size}px;height:${size}px;background:${q.get('bg') || 'transparent'};display:block`;
    const pad = Math.round(size * Number(q.get('pad') || 0));
    document.body.innerHTML = `<img src="../assets/favicon.svg" alt="" style="display:block;width:${size - pad * 2}px;height:${size - pad * 2}px;margin:${pad}px">`;
} else {
    const text = value => String(value || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    document.body.innerHTML = `<div class="copy"><img class="logo" src="../assets/brand/lauren-logo.svg" alt=""><p class="eyebrow">${text(q.get('eyebrow'))}</p><h1>${text(q.get('title'))}<br><em>${text(q.get('em'))}</em></h1><p class="foot">laurenreposteria.com · Pedidos por WhatsApp</p></div><div class="art"><div class="photo" style="--focus:${text(q.get('focus') || '50% 50%')}"><img src="..${text(q.get('photo'))}" alt=""></div><div class="seal"><img src="../assets/brand/lauren-sello-light.svg" alt=""></div></div>`;
}
</script>
</body>
</html>
