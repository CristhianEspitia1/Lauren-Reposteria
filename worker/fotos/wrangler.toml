# Cloudflare Worker que guarda y sirve las fotos subidas desde el centro de control.
# Se publica solo con cada cambio en worker/fotos (Cloudflare Workers Builds conectado al repositorio).
# Guía en docs/13-centro-de-control.md («Subir fotos nuevas»). No necesita llaves ni secretos.
name = "lauren-reposteria"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true

# Almacén de las fotos (Workers KV, gratis). Wrangler lo crea solo en la primera publicación.
[[kv_namespaces]]
binding = "FOTOS"

[vars]
FIREBASE_PROJECT = "lauren-reposteria"
ALLOWED_ORIGINS = "https://laurenreposteria.com,https://www.laurenreposteria.com,http://localhost:5173"
# Opcional: correos que pueden subir fotos, separados por comas. Vacío = cualquier administrador con doble factor.
ADMIN_EMAILS = ""
